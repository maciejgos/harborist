services:
  service:
    environment:
      SHIPYARD_SANDBOX_HOST: host.docker.internal
      SHIPYARD_SANDBOX_PORT: "${SHIPYARD_SANDBOX_PORT:-19454}"
      SHIPYARD_SANDBOX_TOKEN_FILE: /run/shipyard/sandbox-token
    volumes:
      - type: bind
        source: "${SHIPYARD_DEPLOY_STATE:?Start the deployment with deploy/shipyard}/token"
        target: /run/shipyard/sandbox-token
        read_only: true
