[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "shipyard"
version = "0.1.0"
description = "A local delivery harness for native coding agents"
readme = "README.md"
requires-python = ">=3.14"
dependencies = ["pydantic>=2,<3"]

[dependency-groups]
dev = ["pytest>=9", "ruff>=0.14", "pyright>=1.1"]

[tool.hatch.build.targets.wheel]
packages = ["src/shipyard"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"

[tool.pyright]
pythonVersion = "3.14"
typeCheckingMode = "strict"
include = ["src", "tests"]
venvPath = "."
venv = ".venv"
