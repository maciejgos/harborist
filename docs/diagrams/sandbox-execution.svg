<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 364" role="img" aria-labelledby="title">
  <title id="title">Docker deployment and sandbox execution</title>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#53737e"/></marker></defs>
  <rect width="660" height="364" rx="16" fill="#f1f6f7"/>
  <g fill="none" stroke="#53737e" stroke-width="2" marker-end="url(#arrow)">
    <path d="M290 52H370"/>
    <path d="M500 81V131"/>
    <path d="M500 189V231H120V267"/>
    <path d="M330 231V267"/>
    <path d="M500 231H540V267"/>
  </g>
  <g font-family="system-ui, sans-serif" text-anchor="middle" fill="#153542">
    <rect x="30" y="23" width="260" height="58" rx="10" fill="#fff" stroke="#7c9aa4"/>
    <text x="160" y="49" font-size="17" font-weight="650">Web container</text>
    <text x="160" y="69" font-size="13">Loopback browser port</text>
    <rect x="370" y="23" width="260" height="58" rx="10" fill="#fff" stroke="#7c9aa4"/>
