name: Website

on:
  pull_request:
    paths: ['website/**', 'docs/**', 'COMMANDS.md', '.github/workflows/website.yml']
  push:
    branches: [main]
    paths: ['website/**', 'docs/**', 'COMMANDS.md', '.github/workflows/website.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
        working-directory: website
      - run: npm run build
        working-directory: website
        env:
          PAGES_ORIGIN: https://harborist.pages.dev
